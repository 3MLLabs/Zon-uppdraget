# elev-40 webb: central loggning till log över TLS (milstolpe 5)
# Ligger på servern som /etc/rsyslog.d/90-logg.conf
global(DefaultNetstreamDriverCAFile="/etc/pki/rsyslog/ca.pem")

# Urval: system, autentisering, brandvägg (kern) och auditd (via audisp-syslog)
if prifilt("*.info;mail.none;cron.none") then {
  action(type="omfwd" target="172.20.1.58" port="6514" protocol="tcp"
    template="RSYSLOG_SyslogProtocol23Format"
    StreamDriver="gtls" StreamDriverMode="1" StreamDriverAuthMode="x509/name"
    StreamDriverPermittedPeers="log.sec.chas-lab.dev"
    queue.type="LinkedList" queue.filename="fwd_tls" queue.saveOnShutdown="on"
    action.resumeRetryCount="-1")
}
